database:
    url: "postgres://soybean:soybean@123.@localhost:6432/soybean_admin_rust"
    max_connections: 10
    min_connections: 1
    connect_timeout: 30
    idle_timeout: 600
server:
    host: "0.0.0.0"
    port: 9528
jwt:
    # F1.1: test secret、32-char 合規值通過 strict validation；公開於 yaml 不影響 prod
    jwt_secret: "dev-test-secret-padded-to-thirty-two!"
    issuer: "https://github.com/ByteByteBrew/soybean-admin-rust"
    expire: 7200
    refresh_secret: "dev-test-refresh-secret-padded-32!"
    refresh_expire: 7200
redis:
    mode: single
    url: "redis://:123456@localhost:6379/2"
# 042 audit-outbox-and-http-mount: drainer + Redis Stream publisher 配置
audit_outbox:
    drainer_batch_size: 100
    drainer_sleep_interval_ms: 50
    drainer_max_retry: 5
    redis_stream_maxlen_approx: 10000
# 由于本项目最终目标可能仅仅作为一般rbac项目,因此redis作为可选组件,可以根据实际情况进行按需使用
# 有需求自行取消注释
