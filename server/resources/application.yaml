database:
    url: "postgres://soybean:soybean@123.@pgbouncer:6432/soybean_admin_rust"
    max_connections: 10
    min_connections: 1
    connect_timeout: 30
    idle_timeout: 600
server:
    host: "0.0.0.0"
    port: 10001
jwt:
    # F1.1: prod 必透過 APP_JWT_JWT_SECRET_FILE 或 APP_JWT_JWT_SECRET envvar 設真 secret；
    # 此處 placeholder 值會被 config_init strict validation panic 拒絕、避免誤啟動。
    # 產生方式：openssl rand -hex 32
    jwt_secret: "change-me-jwt-secret"
    issuer: "https://github.com/ByteByteBrew/soybean-admin-rust"
    expire: 7200
    refresh_secret: "change-me-refresh-secret-padded!"
    refresh_expire: 7200
redis:
    mode: single
    url: "redis://:123456@redis:6379/10"
# 042 audit-outbox-and-http-mount: drainer + Redis Stream publisher 配置
audit_outbox:
    drainer_batch_size: 100
    drainer_sleep_interval_ms: 50
    drainer_max_retry: 5
    redis_stream_maxlen_approx: 10000
# 可选 自行配置
